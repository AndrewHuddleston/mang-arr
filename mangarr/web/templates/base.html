<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}mang-arr{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
  <a class="brand" href="/">mang-arr</a>
  <a href="/" {% if request.url.path == '/' %}class="on"{% endif %}>Series</a>
  <a href="/add" {% if request.url.path.startswith('/add') %}class="on"{% endif %}>Add</a>
  <a href="/wanted" {% if request.url.path.startswith('/wanted') %}class="on"{% endif %}>Wanted</a>
  <a href="/activity" {% if request.url.path.startswith('/activity') %}class="on"{% endif %}>Activity</a>
  <a href="/settings" {% if request.url.path.startswith('/settings') %}class="on"{% endif %}>Settings</a>
  <a href="/system" {% if request.url.path.startswith('/system') %}class="on"{% endif %}>System</a>
  <span class="spacer"></span>
  <span id="status" class="muted">{% if current %}running: {{ current.kind }} {{ current.title }}{% endif %}</span>
</nav>
<main>
{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
<footer class="muted">mang-arr {{ version }}</footer>
<script>
async function poll(){
  try{
    const r = await fetch('/api/v1/system/status'); const d = await r.json();
    const el = document.getElementById('status');
    el.textContent = d.job ? `running: ${d.job.kind} ${d.job.title} ${d.job.progress||''}` : '';
  }catch(e){}
}
setInterval(poll, 5000);
</script>
{% block script %}{% endblock %}
</body>
</html>
