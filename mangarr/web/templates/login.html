<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign in - mang-arr</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
<main class="login-box">
  <div class="brand"><span class="brand-mark">M</span><span class="brand-name">mang-arr</span></div>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="col">
    <input type="hidden" name="next" value="{{ next }}">
    <input name="username" placeholder="username" aria-label="Username" autocomplete="username" autofocus required>
    <input name="password" type="password" placeholder="password" aria-label="Password" autocomplete="current-password" required>
    <button>Sign in</button>
  </form>
  <p class="muted small" style="margin:14px 0 0">mang-arr {{ version }}</p>
</main>
</body>
</html>
