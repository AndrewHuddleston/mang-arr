<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign in - mang-arr</title>
<link rel="icon" type="image/svg+xml" href="/static/mark.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
{% include "icons.html" %}
<main class="login-box">
  <div class="brand"><img class="brand-mark" src="/static/mark.svg" alt="" width="32" height="32"><span class="brand-name">mang<em>-arr</em></span></div>
  {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form login-form">
    <input type="hidden" name="next" value="{{ next }}">
    <input class="input" name="username" placeholder="Username" aria-label="Username" autocomplete="username" autofocus required>
    <input class="input" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
    <button class="button primary large">Sign in</button>
  </form>
  <div class="login-footer">mang-arr {{ version }}</div>
</main>
</body>
</html>
