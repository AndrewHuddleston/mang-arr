  <path d="M31 22v16" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- page lines -->
  <g stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".85">
    <line x1="22" y1="27" x2="28" y2="26"/>
    <line x1="22" y1="31" x2="28" y2="30"/>
    <line x1="36" y1="26" x2="42" y2="27"/>
    <line x1="36" y1="30" x2="42" y2="31"/>
