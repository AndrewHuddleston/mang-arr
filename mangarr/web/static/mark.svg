<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="mang-arr">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#7a43ff"/>
    </linearGradient>
  </defs>
  <!-- rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <!-- manga impact / speed lines, top-right -->
  <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".95">
    <line x1="46" y1="9" x2="52" y2="4"/>
    <line x1="52" y1="16" x2="59" y2="13"/>
    <line x1="40" y1="7" x2="42" y2="3"/>
  </g>
