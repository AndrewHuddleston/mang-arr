# The full stack: Suwayomi (sources + downloads), Komga (reader), mang-arr
# (manager). install.sh generates this file for you; copy it by hand if you
# prefer. Read docs/INSTALL.md for the setup steps that follow `up -d`.
#
# One data tree, because the library is made of hard links:
#   ./data/staging/<Source>/<Series>/*.cbz    Suwayomi writes here (never renamed)
#   ./data/library/<Series>/Chapter 012.0.cbz mang-arr builds this; Komga reads it
# Both must be under the same Docker mount (/data below) on one filesystem.
#
# The containers run as 1000:1000; chown ./config and ./data to match, or
# change the user: lines.
#
# Network exposure: mang-arr talks to Suwayomi and Komga over the compose
# network, so their ports are published on 127.0.0.1 only (this machine).
# Suwayomi has no login and installs extension code on request: do not open
# it to the network; use `ssh -L 4567:127.0.0.1:4567 <host>` to reach its UI.
# To read from phones and tablets, publish Komga on the network after you
# have created its admin account: change its line to "25600:25600".
# Turn on mang-arr's login (Settings -> Security) before you store any keys.

# Docker keeps container output forever unless told otherwise: cap it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: suwayomi
    user: "1000:1000"
    environment:
      - TZ=Etc/UTC
      - DOWNLOAD_AS_CBZ=true
    volumes:
      - ./config/suwayomi:/home/suwayomi/.local/share/Tachidesk
      - ./data/staging:/home/suwayomi/.local/share/Tachidesk/downloads/mangas
    ports:
      - "127.0.0.1:4567:4567"
    logging: *logging
    restart: unless-stopped

  komga:
    image: gotson/komga:latest
    container_name: komga
    user: "1000:1000"
    environment:
      - TZ=Etc/UTC
    volumes:
      - ./config/komga:/config
      - ./data/library:/library:ro
    ports:
      - "127.0.0.1:25600:25600"
    logging: *logging
    restart: unless-stopped

  mangarr:
    image: ghcr.io/andrewhuddleston/mang-arr:latest
    container_name: mangarr
    user: "1000:1000"
    depends_on:
      - suwayomi
    environment:
      - TZ=Etc/UTC
      - MANGARR_SUWAYOMI_URL=http://suwayomi:4567
      - MANGARR_STAGING=/data/staging
      - MANGARR_LIBRARY=/data/library
      # optional:
      # - MANGARR_REFRESH_HOURS=6
      # - MANGARR_LOG_LEVEL=INFO
      # - MANGARR_LOG_JSON=1
      # - MANGARR_BACKUP_HOURS=24
      # - MANGARR_BACKUPS_KEEP=7
      # - MANGARR_PUSHOVER_TOKEN=...
      # - MANGARR_PUSHOVER_USER=...
      # - MANGARR_WEBHOOK_URL=...
      # host names you open mang-arr by, other than IPs, localhost, single-label names and *.lan/.local/.home.arpa:
      # - MANGARR_ALLOWED_HOSTS=manga.example.com
    volumes:
      - ./config/mangarr:/config
      - ./data:/data
    ports:
      - "6789:6789"
    logging: *logging
    restart: unless-stopped
